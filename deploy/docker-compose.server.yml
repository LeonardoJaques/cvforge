# Production stack. API containers have no public Traefik route; the stable
# router container switches between them after a candidate passes health checks.
services:
  db:
    image: postgres:16-alpine
    container_name: cvforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cvforge
      POSTGRES_USER: cvforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /home/leo/cvforge/data/db:/var/lib/postgresql/data
    networks:
      - cvforge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvforge -d cvforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  x-api-common: &api-common
    image: cvforge-api:${CVFORGE_IMAGE_TAG:-latest}
    build:
      context: /home/leo/cvforge-source-sync/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cvforge
      SPRING_DATASOURCE_USERNAME: cvforge
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "true"
      CVFORGE_TRUSTED_PROXY_IP: 172.22.0.5
      LLDAP_HTTP_URL: ${LLDAP_HTTP_URL}
      LLDAP_BASE_DN: ${LLDAP_LDAP_BASE_DN}
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_RESUME_MODEL: ${OPENROUTER_RESUME_MODEL:-deepseek/deepseek-chat}
      OTEL_SERVICE_NAME: cvforge-api
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.1"
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_BSP_MAX_QUEUE_SIZE: "256"
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "64"
      OTEL_BSP_SCHEDULE_DELAY: "5000"
      OTEL_BSP_EXPORT_TIMEOUT: "10000"
      OTEL_EXPORTER_OTLP_TIMEOUT: "10000"
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_REQUEST_HEADERS: ""
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_RESPONSE_HEADERS: ""
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: ""
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_RESPONSE_HEADERS: ""
      OTEL_INSTRUMENTATION_HTTP_CLIENT_EMIT_EXPERIMENTAL_TELEMETRY: "false"
      OTEL_INSTRUMENTATION_HTTP_SERVER_EMIT_EXPERIMENTAL_TELEMETRY: "false"
      OTEL_INSTRUMENTATION_SERVLET_EXPERIMENTAL_CAPTURE_REQUEST_PARAMETERS: ""
      OTEL_INSTRUMENTATION_JDBC_EXPERIMENTAL_CAPTURE_QUERY_PARAMETERS: "false"
      OTEL_INSTRUMENTATION_COMMON_DB_QUERY_SANITIZATION_ENABLED: "true"
    volumes:
      - /home/leo/docker/otel/opentelemetry-javaagent-2.33.0.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cvforge-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  api-red:
    <<: *api-common
    container_name: cvforge-api-red

  api-green:
    <<: *api-common
    container_name: cvforge-api-green

  api-router:
    image: nginx:alpine
    container_name: cvforge-api-router
    restart: unless-stopped
    volumes:
      - /home/leo/cvforge/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/leo/cvforge/deploy/nginx:/etc/nginx/cvforge:ro
    networks:
      cvforge-net:
        ipv4_address: 172.22.0.5
      web: {}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.cvforge-api-router.rule=Host(`jaquesprojetos.com.br`) && PathPrefix(`/cvforge/api`)"
      - "traefik.http.routers.cvforge-api-router.priority=${CVFORGE_API_ROUTER_PRIORITY:-10}"
      - "traefik.http.routers.cvforge-api-router.entrypoints=websecure"
      - "traefik.http.routers.cvforge-api-router.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.cvforge-api-router-stripprefix.stripprefix.prefixes=/cvforge"
      - "traefik.http.routers.cvforge-api-router.middlewares=authelia-forwardauth@docker,cvforge-api-router-stripprefix"
      - "traefik.http.services.cvforge-api-router.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: /home/leo/cvforge-source-sync/frontend
      dockerfile: Dockerfile
    image: cvforge-frontend:latest
    container_name: cvforge-frontend
    restart: unless-stopped
    networks:
      - cvforge-net
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.cvforge-frontend.rule=Host(`jaquesprojetos.com.br`) && PathPrefix(`/cvforge`) && !PathPrefix(`/cvforge/api`)"
      - "traefik.http.routers.cvforge-frontend.entrypoints=websecure"
      - "traefik.http.routers.cvforge-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.cvforge-frontend.loadbalancer.server.port=80"
      - "traefik.http.middlewares.cvforge-frontend-stripprefix.stripprefix.prefixes=/cvforge"
      - "traefik.http.routers.cvforge-frontend.middlewares=authelia-forwardauth@docker,cvforge-frontend-stripprefix"

networks:
  web:
    external: true
  cvforge-net:
    driver: bridge
