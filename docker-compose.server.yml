# CVForge — Docker Compose (servidor homevps — com rotas do Traefik)
# Este arquivo é substituto do docker-compose.yml para o deploy no servidor.
# Ele inclui labels do Traefik para as rotas /cvforge e /cvforge/api.

services:
  # ========== PostgreSQL — persistência de currículos ==========
  db:
    image: postgres:16-alpine
    container_name: cvforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cvforge
      POSTGRES_USER: cvforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /home/leo/cvforge/data/db:/var/lib/postgresql/data
    networks:
      - cvforge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvforge -d cvforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========== API — Spring Boot (Java 21 LTS) ==========
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cvforge-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cvforge
      SPRING_DATASOURCE_USERNAME: cvforge
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "true"
      CVFORGE_TRUSTED_PROXY_IP: ${CVFORGE_TRUSTED_PROXY_IP:-172.19.0.16}
      LLDAP_HTTP_URL: ${LLDAP_HTTP_URL}
      LLDAP_BASE_DN: ${LLDAP_LDAP_BASE_DN}
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
    # Sem porta exposta — Traefik encaminha diretamente
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cvforge-net
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.cvforge-api.rule=Host(`jaquesprojetos.com.br`) && PathPrefix(`/cvforge/api`)"
      - "traefik.http.routers.cvforge-api.entrypoints=websecure"
      - "traefik.http.routers.cvforge-api.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.cvforge-api-stripprefix.stripprefix.prefixes=/cvforge"
      - "traefik.http.routers.cvforge-api.middlewares=authelia-forwardauth@docker,cvforge-api-stripprefix"
      - "traefik.http.services.cvforge-api.loadbalancer.server.port=8080"

  # ========== Frontend — Angular (nginx) ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cvforge-frontend
    restart: unless-stopped
    # Sem porta exposta — Traefik encaminha diretamente
    depends_on:
      - api
    networks:
      - cvforge-net
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.cvforge-frontend.rule=Host(`jaquesprojetos.com.br`) && PathPrefix(`/cvforge`) && !PathPrefix(`/cvforge/api`)"
      - "traefik.http.routers.cvforge-frontend.entrypoints=websecure"
      - "traefik.http.routers.cvforge-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.cvforge-frontend.loadbalancer.server.port=80"
      - "traefik.http.middlewares.cvforge-frontend-stripprefix.stripprefix.prefixes=/cvforge"
      - "traefik.http.routers.cvforge-frontend.middlewares=authelia-forwardauth@docker,cvforge-frontend-stripprefix"

# ========== Rede dedicada (serviços internos) ==========
networks:
  web:
    external: true    # Rede existente do Traefik no servidor
  cvforge-net:
    driver: bridge
