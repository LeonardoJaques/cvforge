server:
  port: 8080

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:openrouter/free}

spring:
  application:
    name: cvforge-api
  http:
    converters:
      # The API uses Jackson 2 JsonNode at its HTTP boundaries.
      preferred-json-mapper: jackson2
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  main:
    keep-alive: true
  jackson:
    use-jackson2-defaults: true
  datasource:
    url: jdbc:postgresql://localhost:5432/cvforge
    username: cvforge
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Logging
logging:
  level:
    com.cvforge: INFO
    org.springframework: INFO
