server:
  port: 8080

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:openrouter/free}

spring:
  application:
    name: cvforge-api
  datasource:
    url: jdbc:postgresql://localhost:5432/cvforge
    username: cvforge
    password: ${POSTGRES_PASSWORD:cvforge_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Logging
logging:
  level:
    com.cvforge: INFO
    org.springframework: INFO
